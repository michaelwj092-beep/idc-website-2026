  <circle cx="860.2799865722657" cy="259.8" r="89.2" fill="none" stroke="#E34C89" stroke-width="16" stroke-dasharray="93.4100215667365 46.70501078336825" transform="rotate(15, 860.2799865722657, 259.8)"></circle>
  
  <!-- 4 Alignment Ticks in the Gaps -->
